name: Build and Push Docker Image

# 触发条件：当你手动点击运行，或者你的 fork 仓库更新(push)时自动触发
on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

env:
  REGISTRY: ghcr.io
  # github.repository 会自动获取你的 "用户名/仓库名"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 必须赋予权限，否则无法将打包好的镜像推送到你的 GitHub 账号下
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出（下载）你仓库的代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 将镜像名称强制转为小写（Docker 镜像严格要求小写，防止报错）
      - name: Lowercase the image name
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # 3. 登录到 GitHub 的镜像托管中心 (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动提供的密钥，你什么都不用管

      # 4. 配置 Docker 编译环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 编译并推送到你的镜像库！
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: core/Dockerfile   # 针对这个项目特殊的 Dockerfile 路径
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
          # 开启 GitHub Action 免费云端缓存，下次编译起飞！
          cache-from: type=gha
          cache-to: type=gha,mode=max
